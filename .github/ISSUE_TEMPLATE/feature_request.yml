name: Feature request
description: Suggest an improvement or missing capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: A sample of the generated code you would like to see is the most useful thing to include.
