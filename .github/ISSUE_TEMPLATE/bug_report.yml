name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead? The apiSpec fragment (or `npx convex function-spec` output) for the function involved helps a lot.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: convex-ue-codegen version
      placeholder: e.g. v0.2.0, or a commit hash
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Which surface?
      options:
        - CLI
        - Web app
        - Generated C++ does not compile
        - Generated Blueprint library
        - Generated AngelScript
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform, compiler or browser
      placeholder: e.g. Windows 11 / MSVC 2022, Ubuntu 24.04 / gcc 13, Chrome 140
